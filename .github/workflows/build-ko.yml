name: 编译可加载 taint_clear.ko（OPPO A6 5G / 5.15.197）

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: '内核分支'
        required: true
        default: 'android13-5.15-2026-03'
      utsrelease:
        description: '强制对齐的 vermagic'
        required: true
        default: '5.15.197-android13-11-g046261213cac'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 curl xz-utils rsync cpio kmod file

      - name: 取模块源码
        uses: actions/checkout@v4
        with: { path: module }

      - name: 下载 AOSP 官方 clang
        run: |
          mkdir -p clang
          for ref in refs/heads/main refs/heads/master refs/heads/android13-release; do
            curl -fL --retry 3 -m 1200 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$ref/clang-r450784e.tar.gz" \
              -o clang.tgz && break
          done
          tar -xzf clang.tgz -C clang
          clang/bin/clang --version | head -1

      - name: 缓存内核源码
        uses: actions/cache@v3
        with:
          path: kernel
          key: ${{ runner.os }}-kernel-${{ inputs.kernel_ref }}

      - name: 拉内核源码
        run: |
          git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
            https://android.googlesource.com/kernel/common kernel
          grep -m3 -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile

      - name: 配置
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          make ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --enable LTO_CLANG_THIN --disable LTO_CLANG_FULL \
            --enable CFI_CLANG --enable CFI_CLANG_SHADOW
          make ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^(CONFIG_LTO_CLANG_THIN|CONFIG_CFI_CLANG|CONFIG_MODVERSIONS|CONFIG_PREEMPT)=' .config

      - name: 编 vmlinux 生成符号 CRC 表
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          make ARCH=arm64 LLVM=1 -j2 vmlinux
          test -s Module.symvers && echo "Module.symvers 行数: $(wc -l < Module.symvers)"

      - name: 对齐 vermagic
        run: |
          cd kernel
          printf '#define UTS_RELEASE "%s"\n' "${{ inputs.utsrelease }}" > include/generated/utsrelease.h
          printf '%s\n' "${{ inputs.utsrelease }}" > include/config/kernel.release

      - name: 编 taint_clear.ko
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          mkdir -p taint_clear
          cp "$GITHUB_WORKSPACE/module/taint_clear.c" taint_clear/
          printf 'obj-m += taint_clear.o\n' > taint_clear/Makefile
          make ARCH=arm64 LLVM=1 M="$PWD/taint_clear" modules
          cp taint_clear/taint_clear.ko "$GITHUB_WORKSPACE/"

      - name: 产物报告
        run: |
          file taint_clear.ko
          strings taint_clear.ko | grep -E '^(vermagic|name|license)=' || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: taint_clear-ko-PLS120
          path: taint_clear.ko
          if-no-files-found: error
